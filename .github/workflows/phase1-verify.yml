name: Phase 1 Verify

on:
  push:
    branches:
      - feat/calendar-code-review

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DISCORD_TOKEN: test-token
      DISCORD_CLIENT_ID: test-client
      GITHUB_TOKEN: test-github
      FIGMA_TOKEN: test-figma
      NOTION_TOKEN: test-notion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --import tsx --test tests/project-setup.test.ts
