name: Setup Doctor Verify

on:
  push:
    branches:
      - feat/calendar-code-review

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DISCORD_TOKEN: test-token
      DISCORD_CLIENT_ID: test-client
      GITHUB_TOKEN: test-github
      FIGMA_TOKEN: test-figma
      NOTION_TOKEN: test-notion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: git diff --check
      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose config >/dev/null
      - name: Build production image
        run: docker build -t iseol-bot:test .
      - name: Run setup doctor inside production image
        run: |
          docker run --rm \
            -e DISCORD_TOKEN \
            -e DISCORD_CLIENT_ID \
            -e GITHUB_TOKEN \
            -e FIGMA_TOKEN \
            -e NOTION_TOKEN \
            iseol-bot:test npm run doctor:prod
